apiVersion: batch/v1
kind: Job
metadata:
  name: hbp-batch
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: batch
          image: hbp-batch:local
          imagePullPolicy: Never
          command: ["python", "-m", "hbp.pipeline", "--light"]
